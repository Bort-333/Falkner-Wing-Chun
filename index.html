<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Media Page</title>
    <style>
        /* base */
        body {
            background-color: #333333;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* header */
        header {
            background-color: #d32f2f;
            color: #ffffff;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* header image pos */
        .header-logo {
            width: 50px;
            height: 50px;
            border-radius: 5px;
        }

        /* body */
        main {
            flex: 1;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }

        /* media card */
        figure {
            background-color: #ffffff;
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        figure img, figure video {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        figcaption {
            margin-top: 10px;
            font-size: 0.9em;
            color: #555555;
            text-align: center;
        }

        /* footer */
        footer {
            background-color: #d32f2f;
            color: #ffffff;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

    <!-- header + pic1 -->
    <header>
        <div>
            <h1 style="margin: 0;">My Media Page</h1>
            <p style="margin: 5px 0 0 0;">A simple layout example</p>
        </div>
        <img class="header-logo" src="pic1" alt="Header PNG Logo">
    </header>

    <!-- Main Content Area -->
    <main>
        <p>This is standard body text explaining the media content showcased below.</p>

        <!-- pic2 -->
        <figure>
            <img src="pic2" alt="Sample JPEG Image">
            <figcaption><strong>Figure 1:</strong> A standard JPEG image sample showcasing a landscape view.</figcaption>
        </figure>

        <p>Below is a short video file embedded directly into the page with full controls enabled.</p>

        <!-- vid1 -->
        <figure>
            <video controls>
                <source src="vid1" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <figcaption><strong>Video 1:</strong> An MP4 video file demo with native player controls.</figcaption>
        </figure>

        
    </main>

    <!-- footer -->
    <footer>
        <p style="margin: 0;">&copy; 2026 My Webpage. All rights reserved.</p>
    </footer>

</body>
</html>
